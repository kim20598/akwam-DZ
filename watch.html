<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة - أكوام حقيقي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <style>
        .watch-container {
            padding-top: 80px;
            background: #000;
            min-height: 100vh;
        }
        
        .video-player {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }
        
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .loading-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
        }
        
        .loading-player .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .video-info {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-light);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .video-title {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        
        .video-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .video-description {
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        
        .quality-selector {
            margin-top: 30px;
        }
        
        .quality-selector h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quality-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .quality-btn {
            padding: 10px 20px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .quality-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .quality-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        
        .episode-selector {
            margin-top: 30px;
        }
        
        .episode-selector h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        
        .episode-btn {
            padding: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 14px;
        }
        
        .episode-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .episode-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        
        .episode-btn.watched {
            opacity: 0.7;
            border-color: var(--success-color);
        }
        
        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .video-controls button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-download {
            background: #2196F3;
            color: white;
        }
        
        .btn-download:hover {
            background: #1976D2;
        }
        
        .btn-share {
            background: #4CAF50;
            color: white;
        }
        
        .btn-share:hover {
            background: #388E3C;
        }
        
        .btn-favorite {
            background: #FF9800;
            color: white;
        }
        
        .btn-favorite:hover {
            background: #F57C00;
        }
        
        .btn-favorite.active {
            background: #f44336;
        }
        
        .no-sources {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .no-sources i {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
    </style>
</head>
