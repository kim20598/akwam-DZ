<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة - أكوام حقيقي</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <style>
        .watch-container {
            padding-top: 80px;
            background: #000;
            min-height: 100vh;
        }
        
        .video-player {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }
        
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .loading-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
        }
        
        .loading-player .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .video-info {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-light);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .video-title {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        
        .video-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .video-description {
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        
        .quality-selector {
            margin-top: 30px;
        }
        
        .quality-selector h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quality-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .quality-btn {
            padding: 10px 20px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .quality-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .quality-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        
        .episode-selector {
            margin-top: 30px;
        }
        
        .episode-selector h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        
        .episode-btn {
            padding: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 14px;
        }
        
        .episode-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .episode-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        
        .episode-btn.watched {
            opacity: 0.7;
            border-color: var(--success-color);
        }
        
        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .video-controls button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-download {
            background: #2196F3;
            color: white;
        }
        
        .btn-download:hover {
            background: #1976D2;
        }
        
        .btn-share {
            background: #4CAF50;
            color: white;
        }
        
        .btn-share:hover {
            background: #388E3C;
        }
        
        .btn-favorite {
            background: #FF9800;
            color: white;
        }
        
        .btn-favorite:hover {
            background: #F57C00;
        }
        
        .btn-favorite.active {
            background: #f44336;
        }
        
        .no-sources {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .no-sources i {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <a href="index.html" class="logo">
                        <i class="fas fa-film"></i>
                        <span>أكوام</span>
                    </a>
                </div>
                
                <div class="nav-menu">
                    <ul class="nav-links">
                        <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                        <li><a href="movies.html"><i class="fas fa-video"></i> الأفلام</a></li>
                        <li><a href="series.html"><i class="fas fa-tv"></i> المسلسلات</a></li>
                    </ul>
                </div>
                
                <button class="mobile-toggle" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="watch-container">
        <div class="container">
            <!-- Video Player -->
            <div class="video-player">
                <div class="video-wrapper">
                    <div class="loading-player" id="playerLoading">
                        <div class="spinner"></div>
                        <p>جاري تحميل الفيديو من أكوام...</p>
                    </div>
                    <video id="videoPlayer" controls>
                        <!-- Video source will be added by JavaScript -->
                    </video>
                </div>
            </div>
            
            <!-- Video Info -->
            <div class="video-info" id="videoInfo">
                <!-- Content will be loaded by JavaScript -->
            </div>
            
            <!-- Related Content -->
            <div class="related-content" id="relatedContent" style="display: none;">
                <!-- Will be loaded if available -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2024 أكوام حقيقي - محتوى من <a href="https://ak.sv" target="_blank">ak.sv</a></p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/scraper.js"></script>
    <script>
        // Get content URL from query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const contentUrl = urlParams.get('url');
        const contentType = urlParams.get('type') || 'movie';
        
        // Global variables
        let videoSources = [];
        let contentDetails = null;
        let currentSourceIndex = 0;

        document.addEventListener('DOMContentLoaded', async function() {
            if (!contentUrl) {
                showError('لم يتم تحديد رابط المحتوى');
                return;
            }
            
            try {
                // Show loading
                document.getElementById('playerLoading').style.display = 'block';
                
                // Fetch content details
                contentDetails = await akwamScraper.getContentDetails(contentUrl);
                
                if (!contentDetails) {
                    throw new Error('Failed to load content details');
                }
                
                // Update page title and info
                document.title = `${contentDetails.title} - أكوام`;
                renderContentInfo(contentDetails);
                
                // Fetch video sources
                videoSources = await akwamScraper.getVideoSources(contentUrl);
                
                if (videoSources.length === 0) {
                    // Try to get sources from first episode if series
                    if (contentDetails.episodes && contentDetails.episodes.length > 0) {
                        const firstEpisode = contentDetails.episodes[0];
                        videoSources = await akwamScraper.getVideoSources(firstEpisode.url);
                    }
                }
                
                if (videoSources.length > 0) {
                    setupVideoPlayer();
                } else {
                    showNoSources();
                }
                
                // Setup episode selector if series
                if (contentDetails.episodes && contentDetails.episodes.length > 0) {
                    setupEpisodeSelector();
                }
                
            } catch (error) {
                console.error('Error loading content:', error);
                showError('فشل في تحميل المحتوى. حاول مرة أخرى.');
            } finally {
                document.getElementById('playerLoading').style.display = 'none';
            }
        });

        function renderContentInfo(details) {
            const videoInfo = document.getElementById('videoInfo');
            
            let html = `
                <h1 class="video-title">${details.title}</h1>
                
                <div class="video-meta">
                    ${details.year ? `<span><i class="fas fa-calendar"></i> ${details.year}</span>` : ''}
                    <span><i class="fas fa-${details.type === 'movie' ? 'film' : 'tv'}"></i> 
                        ${details.type === 'movie' ? 'فيلم' : 'مسلسل'}
                    </span>
                    ${details.quality ? `<span><i class="fas fa-hd"></i> ${details.quality}</span>` : ''}
                </div>
                
                ${details.description ? `<p class="video-description">${details.description}</p>` : ''}
                
                <div class="video-controls">
                    <button class="btn-download" onclick="downloadVideo()">
                        <i class="fas fa-download"></i> تحميل
                    </button>
                    <button class="btn-share" onclick="shareVideo()">
                        <i class="fas fa-share"></i> مشاركة
                    </button>
                    <button class="btn-favorite" id="favoriteBtn" onclick="toggleFavorite()">
                        <i class="far fa-heart"></i> إضافة للمفضلة
                    </button>
                </div>
            `;
            
            videoInfo.innerHTML = html;
        }

        function setupVideoPlayer() {
            const videoPlayer = document.getElementById('videoPlayer');
            
            if (videoSources.length === 0) {
                showNoSources();
                return;
            }
            
            // Clear existing sources
            while (videoPlayer.firstChild) {
                videoPlayer.removeChild(videoPlayer.firstChild);
            }
            
            // Add sources
            videoSources.forEach((source, index) => {
                if (source.type.includes('video')) {
                    const sourceElement = document.createElement('source');
                    sourceElement.src = source.url;
                    sourceElement.type = source.type;
                    if (source.quality) {
                        sourceElement.setAttribute('data-quality', source.quality);
                    }
                    videoPlayer.appendChild(sourceElement);
                }
            });
            
            // Add quality selector if multiple sources
            if (videoSources.length > 1) {
                addQualitySelector();
            }
            
            // Load the video
            videoPlayer.load();
            
            // Add event listeners
            videoPlayer.addEventListener('loadeddata', function() {
                console.log('Video loaded successfully');
            });
            
            videoPlayer.addEventListener('error', function(e) {
                console.error('Video error:', e);
                tryNextSource();
            });
            
            // Add keyboard shortcuts
            setupKeyboardShortcuts();
        }

        function addQualitySelector() {
            const videoInfo = document.getElementById('videoInfo');
            const qualities = [...new Set(videoSources.map(s => s.quality || 'HD'))];
            
            let html = `
                <div class="quality-selector">
                    <h3><i class="fas fa-hd"></i> جودة الفيديو</h3>
                    <div class="quality-buttons">
            `;
            
            qualities.forEach((quality, index) => {
                html += `
                    <button class="quality-btn ${index === 0 ? 'active' : ''}" 
                            onclick="changeQuality(${index})">
                        ${quality}
                    </button>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            videoInfo.querySelector('.video-controls').insertAdjacentHTML('beforebegin', html);
        }

        function changeQuality(index) {
            const videoPlayer = document.getElementById('videoPlayer');
            const sources = videoPlayer.querySelectorAll('source');
            
            if (index < sources.length) {
                // Update active button
                document.querySelectorAll('.quality-btn').forEach((btn, i) => {
                    btn.classList.toggle('active', i === index);
                });
                
                // Change source
                const currentTime = videoPlayer.currentTime;
                const wasPlaying = !videoPlayer.paused;
                
                videoPlayer.src = sources[index].src;
                videoPlayer.load();
                
                // Restore time and play state
                videoPlayer.currentTime = currentTime;
                if (wasPlaying) {
                    videoPlayer.play().catch(e => console.log('Auto-play prevented:', e));
                }
                
                showNotification(`تم تغيير الجودة إلى ${sources[index].getAttribute('data-quality') || 'HD'}`);
            }
        }

        function tryNextSource() {
            currentSourceIndex++;
            if (currentSourceIndex < videoSources.length) {
                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = videoSources[currentSourceIndex].url;
                videoPlayer.load();
                showNotification(`جرب مصدر بديل ${currentSourceIndex + 1}/${videoSources.length}`);
            } else {
                showError('لا توجد مصادر فيديو تعمل');
            }
        }

        function setupEpisodeSelector() {
            const videoInfo = document.getElementById('videoInfo');
            
            let html = `
                <div class="episode-selector">
                    <h3><i class="fas fa-list"></i> قائمة الحلقات (${contentDetails.episodes.length})</h3>
                    <div class="episodes-grid">
            `;
            
            contentDetails.episodes.forEach((episode, index) => {
                html += `
                    <button class="episode-btn ${index === 0 ? 'active' : ''}" 
                            onclick="loadEpisode('${encodeURIComponent(episode.url)}', ${index})"
                            title="${episode.title}">
                        ${index + 1}
                    </button>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            videoInfo.querySelector('.video-controls').insertAdjacentHTML('beforebegin', html);
        }

        async function loadEpisode(episodeUrl, episodeIndex) {
            try {
                document.getElementById('playerLoading').style.display = 'block';
                
                // Update active episode button
                document.querySelectorAll('.episode-btn').forEach((btn, index) => {
                    btn.classList.toggle('active', index === episodeIndex);
                    if (index < episodeIndex) {
                        btn.classList.add('watched');
                    }
                });
                
                // Fetch video sources for this episode
                const decodedUrl = decodeURIComponent(episodeUrl);
                videoSources = await akwamScraper.getVideoSources(decodedUrl);
                
                if (videoSources.length > 0) {
                    setupVideoPlayer();
                    
                    // Update episode title
                    const episode = contentDetails.episodes[episodeIndex];
                    document.querySelector('.video-title').textContent = episode.title;
                    
                    // Update URL
                    const newUrl = new URL(window.location);
                    newUrl.searchParams.set('url', decodedUrl);
                    window.history.replaceState({}, '', newUrl);
                    
                    showNotification(`تحميل الحلقة ${episodeIndex + 1}`);
                } else {
                    showError('لا توجد مصادر لهذه الحلقة');
                }
                
            } catch (error) {
                console.error('Error loading episode:', error);
                showError('فشل تحميل الحلقة');
            } finally {
                document.getElementById('playerLoading').style.display = 'none';
            }
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                const videoPlayer = document.getElementById('videoPlayer');
                if (!videoPlayer) return;
                
                // Don't trigger when typing
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case ' ':
                    case 'k':
                        e.preventDefault();
                        videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause();
                        break;
                    case 'f':
                        e.preventDefault();
                        if (videoPlayer.requestFullscreen) {
                            videoPlayer.requestFullscreen();
                        }
                        break;
                    case 'm':
                        e.preventDefault();
                        videoPlayer.muted = !videoPlayer.muted;
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        videoPlayer.currentTime += 10;
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        videoPlayer.currentTime -= 10;
                        break;
                    case 'arrowup':
                        e.preventDefault();
                        videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1);
                        break;
                    case 'arrowdown':
                        e.preventDefault();
                        videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1);
                        break;
                    case 'n':
                        if (contentDetails.episodes) {
                            const currentEpisode = Array.from(document.querySelectorAll('.episode-btn'))
                                .findIndex(btn => btn.classList.contains('active'));
                            if (currentEpisode < contentDetails.episodes.length - 1) {
                                loadEpisode(encodeURIComponent(contentDetails.episodes[currentEpisode + 1].url), currentEpisode + 1);
                            }
                        }
                        break;
                    case 'p':
                        if (contentDetails.episodes) {
                            const currentEpisode = Array.from(document.querySelectorAll('.episode-btn'))
                                .findIndex(btn => btn.classList.contains('active'));
                            if (currentEpisode > 0) {
                                loadEpisode(encodeURIComponent(contentDetails.episodes[currentEpisode - 1].url), currentEpisode - 1);
                            }
                        }
                        break;
                }
            });
        }

        function downloadVideo() {
            if (videoSources.length > 0) {
                const link = document.createElement('a');
                link.href = videoSources[0].url;
                link.download = `${contentDetails.title}.mp4`;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('بدأ التحميل، قد يطلب المتصفح التأكيد');
            } else {
                showError('لا يوجد فيديو للتحميل');
            }
        }

        function shareVideo() {
            const title = contentDetails?.title || 'مشاهدة على أكوام';
            const url = window.location.href;
            
            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: 'شاهد هذا المحتوى على أكوام الحقيقي',
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showNotification('تم نسخ رابط المشاهدة');
                });
            }
        }

        function toggleFavorite() {
            const btn = document.getElementById('favoriteBtn');
            const icon = btn.querySelector('i');
            
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                icon.className = 'far fa-heart';
                showNotification('تمت الإزالة من المفضلة');
            } else {
                btn.classList.add('active');
                icon.className = 'fas fa-heart';
                showNotification('تمت الإضافة إلى المفضلة');
            }
        }

        function showNoSources() {
            const videoInfo = document.getElementById('videoInfo');
            const noSourcesHTML = `
                <div class="no-sources">
                    <i class="fas fa-video-slash"></i>
                    <h3>لا توجد مصادر فيديو متاحة</h3>
                    <p>تعذر العثور على مصادر فيديو لهذا المحتوى.</p>
                    <p>يمكنك:</p>
                    <div class="video-controls" style="margin-top: 20px;">
                        <button class="btn-primary" onclick="window.history.back()">
                            <i class="fas fa-arrow-right"></i> العودة
                        </button>
                        <button class="btn-secondary" onclick="location.reload()">
                            <i class="fas fa-redo"></i> إعادة المحاولة
                        </button>
                    </div>
                </div>
            `;
            
            videoInfo.insertAdjacentHTML('beforeend', noSourcesHTML);
        }

        function showError(message) {
            const videoInfo = document.getElementById('videoInfo');
            const errorHTML = `
                <div class="no-sources">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>حدث خطأ</h3>
                    <p>${message}</p>
                    <div class="video-controls" style="margin-top: 20px;">
                        <button class="btn-primary" onclick="location.reload()">
                            <i class="fas fa-redo"></i> إعادة التحميل
                        </button>
                    </div>
                </div>
            `;
            
            videoInfo.innerHTML = errorHTML;
        }

        function showNotification(message) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = 'player-notification';
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
                background: var(--primary-color);
                color: white;
                border-radius: 5px;
                z-index: 10000;
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.3s;
                font-weight: bold;
            `;
            
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateY(0)';
            }, 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(20px)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
