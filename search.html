<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج البحث - أكوام</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <a href="index.html" class="logo">
                        <i class="fas fa-film"></i>
                        <span>أكوام</span>
                    </a>
                </div>
                
                <div class="nav-menu">
                    <ul class="nav-links">
                        <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                        <li><a href="movies.html"><i class="fas fa-video"></i> الأفلام</a></li>
                        <li><a href="series.html"><i class="fas fa-tv"></i> المسلسلات</a></li>
                    </ul>
                </div>
                
                <div class="nav-search">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
                        <button onclick="search()"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                
                <button class="mobile-toggle" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <!-- Search Results Header -->
            <div class="page-header">
                <h1><i class="fas fa-search"></i> نتائج البحث</h1>
                <p id="searchQuery">جاري البحث...</p>
            </div>

            <!-- Search Results -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">النتائج (<span id="resultsCount">0</span>)</h2>
                </div>
                
                <div class="movies-grid" id="searchResults">
                    <!-- Results will be loaded here by JavaScript -->
                    <div class="no-results" style="grid-column: 1 / -1; text-align: center; padding: 50px;">
                        <i class="fas fa-search" style="font-size: 60px; color: var(--primary-color); margin-bottom: 20px;"></i>
                        <h3>لم يتم العثور على نتائج</h3>
                        <p>حاول البحث بكلمات مختلفة أو تصفح الأقسام</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">
                            <i class="fas fa-home"></i> العودة للرئيسية
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2024 أكوام. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
